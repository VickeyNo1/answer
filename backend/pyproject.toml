[project]
name = "answer"
version = "0.1.0"
description = "会计答疑智能体后端 - 面向会计专业学生的 AI 智能答疑系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.0",
    "python-multipart>=0.0.1",
    "dashscope>=1.20.0",
    "chromadb>=0.5.0",
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "openpyxl>=3.1.0",
    "bcrypt>=4.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

# 会计答疑智能体 — 机器B Nginx 反向代理配置
# 放置到 /etc/nginx/conf.d/answer.conf 后 nginx -t && systemctl reload nginx
#
# 统一入口：80 端口同源提供前端与后端，避免 CORS
#   /api/  -> 后端 FastAPI (127.0.0.1:8000)
#   /      -> 前端 Next.js (127.0.0.1:3000)

server {
    listen 80;
    listen [::]:80;
    server_name 8.148.219.179;   # 换成你的域名或机器B 公网 IP

    # 学生批量导入 Excel，放宽请求体上限
    client_max_body_size 20m;

    # ===== 后端 API（含 SSE 流式，必须关闭缓冲）=====
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # SSE 流式关键：关闭缓冲/缓存，拉长读超时，禁用累积
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    # ===== 前端 Next.js =====
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
